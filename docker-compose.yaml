# Trick to avoid re-builds
x-app: &app
  image: adaptive-energy-system:latest
  env_file:
    - .env
  networks:
    - powergrid

services:
  tickgen:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/tickgen"]
    ports:
      - "4840:4840"

  dl:
    <<: *app
    command: ["/usr/local/bin/deferrable_load"]
    ports:
      - "4842:4842"
    depends_on:
      - tickgen

  example_subscriber:
    <<: *app
    command: ["/usr/local/bin/example_subscriber"]
    depends_on:
      - tickgen

networks:
  powergrid:
    driver: bridge
